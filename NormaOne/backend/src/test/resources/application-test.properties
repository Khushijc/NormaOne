# Tests use their own database on the local MongoDB so they never touch development data.
spring.mongodb.database=normaone_test
normaone.bootstrap.super-admin.enabled=false
# Notification attachments are written to the local disk under target/, never to S3, in tests.
normaone.attachments.storage=LOCAL
normaone.attachments.local.directory=target/test-attachments
# The scheduled outbox retry must not fire during a test run; tests call EmailOutboxService.retryDue() themselves.
normaone.email.retry-interval=PT1H
