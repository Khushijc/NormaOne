spring.application.name=backend
server.port=8881

aws.region=eu-central-1
aws.cognito.user-pool-id=eu-central-1_DuNWXi6EQ
aws.cognito.client-id=479954ke5hkfadapmj8ps44n27
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.eu-central-1.amazonaws.com/eu-central-1_DuNWXi6EQ
spring.mongodb.uri=mongodb://localhost:27017/normaone

# Browser sessions: the Cognito ID and refresh tokens are set as HttpOnly cookies by /api/auth/login.
# Secure: AUTO sets it when the request arrived over HTTPS (or X-Forwarded-Proto: https); use ALWAYS in production.
normaone.auth.cookies.secure=${NORMAONE_COOKIE_SECURE:AUTO}
normaone.auth.cookies.same-site=${NORMAONE_COOKIE_SAME_SITE:Strict}
# Match the user pool app client's refresh token expiration.
normaone.auth.cookies.refresh-token-days=${NORMAONE_REFRESH_TOKEN_DAYS:30}
# Lifetime of the first-login (NEW_PASSWORD_REQUIRED) challenge cookie: match the app client's
# authentication flow session duration (Cognito default 3 minutes).
normaone.auth.cookies.challenge-seconds=${NORMAONE_CHALLENGE_SECONDS:180}
# Comma-separated origins allowed to call the API cross-origin with cookies. Empty = no CORS (the
# API tester goes through its own dev-server proxy and is same-origin).
normaone.auth.cors-allowed-origins=${NORMAONE_CORS_ALLOWED_ORIGINS:}

# Administrator-created invitations: Cognito AdminCreateUser emails a temporary password it generates,
# and the first sign-in must set a permanent one. Needs AWS credentials allowed cognito-idp:AdminCreateUser
# and AdminGetUser. false = no Cognito account is created; the invited person self-registers.
normaone.invitations.send-temporary-password=${NORMAONE_INVITATIONS_TEMPORARY_PASSWORD:true}

# Notifications: most recipients a SELECTED notification may have.
normaone.notifications.max-recipients=${NORMAONE_NOTIFICATIONS_MAX_RECIPIENTS:1000}

# Notification attachments. LOCAL keeps files on this machine's disk (development only); S3 keeps them in
# a private bucket (production), downloaded through short-lived presigned URLs. AWS credentials come from
# the default provider chain (environment, profile or instance role) — never from this file.
normaone.attachments.storage=${NORMAONE_ATTACHMENTS_STORAGE:LOCAL}
normaone.attachments.max-size=${NORMAONE_ATTACHMENTS_MAX_SIZE:10MB}
normaone.attachments.allowed-types=${NORMAONE_ATTACHMENTS_ALLOWED_TYPES:PDF,PNG,JPEG,DOCX,XLSX}
normaone.attachments.local.directory=${NORMAONE_ATTACHMENTS_DIR:${user.home}/.normaone/attachments}
normaone.attachments.s3.bucket=${NORMAONE_ATTACHMENTS_S3_BUCKET:}
normaone.attachments.s3.region=${NORMAONE_ATTACHMENTS_S3_REGION:}
normaone.attachments.s3.key-prefix=${NORMAONE_ATTACHMENTS_S3_KEY_PREFIX:}
normaone.attachments.s3.download-url-seconds=${NORMAONE_ATTACHMENTS_DOWNLOAD_URL_SECONDS:60}
# The container's multipart limits: the file, and the whole request (the file plus the JSON part).
spring.servlet.multipart.max-file-size=${NORMAONE_ATTACHMENTS_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${NORMAONE_MULTIPART_MAX_REQUEST_SIZE:11MB}

# Default package assigned at onboarding. These values seed the BASIC plan only when it does not
# exist yet; an existing plan document is never overwritten on startup.
normaone.packages.default-plan-code=BASIC
normaone.packages.backfill-existing-tenants=true
normaone.packages.basic.code=BASIC
normaone.packages.basic.name=Basic
normaone.packages.basic.version=1
normaone.packages.basic.list-price=0.00
normaone.packages.basic.currency-code=EUR
normaone.packages.basic.billing-cycle=MONTHLY
normaone.packages.basic.max-employees=10
normaone.packages.basic.module-apps=NORMAONE

# Super Admin provisioning: off unless enabled explicitly. Supply the values through environment
# variables, never commit them. The account must already be registered and verified in Cognito.
# Step by step: docs/AUTH_RBAC_GUIDE.md section 6.
normaone.bootstrap.super-admin.enabled=${NORMAONE_SUPER_ADMIN_ENABLED:true}
normaone.bootstrap.super-admin.cognito-sub=${NORMAONE_SUPER_ADMIN_COGNITO_SUB:a3042882-b061-702a-02a3-096dfe6df1a2}
normaone.bootstrap.super-admin.email=${NORMAONE_SUPER_ADMIN_EMAIL:khushijc2106@gmail.com}
normaone.bootstrap.super-admin.name=${NORMAONE_SUPER_ADMIN_NAME:SUPER_ADMIN}
# COGNITO: verified with Cognito AdminGetUser at startup (needs AWS credentials).
# TOKEN: provisioned at the account's first sign-in, from its validated ID token (no AWS credentials needed).
normaone.bootstrap.super-admin.verification=${NORMAONE_SUPER_ADMIN_VERIFICATION:TOKEN}
# Refuse when a Super Admin already exists for another account, unless explicitly allowed.
normaone.bootstrap.super-admin.allow-additional=${NORMAONE_SUPER_ADMIN_ALLOW_ADDITIONAL:false}
# Module access. true = at startup, tenant accounts that were never assigned modules get the default
# assignment new accounts receive (all six modules; the owner who registered the organization: every permission;
# other ADMINs: every permission except DELETE; USER: VIEW).
# Idempotent and never touches an account whose modules were ever assigned. Off by default because it
# grants permissions: turn it on once, deliberately (docs/AUTH_RBAC_GUIDE.md section 11).
normaone.modules.backfill-defaults=${NORMAONE_MODULES_BACKFILL_DEFAULTS:false}
# Plan entitlement for modules. false (for now) = an assigned module is available to an active account
# whatever the organization's plan, BASIC included; the plan's modules are only reported. true = a
# module must also be in the current (TRIAL or ACTIVE) plan. Read in one place: ModuleAccessService.
normaone.modules.enforce-plan-entitlement=${NORMAONE_MODULES_ENFORCE_PLAN_ENTITLEMENT:false}

# Outbound email: the Super Admins are emailed when a Tenant Admin requests a plan change (EmailOutboxService).
# Delivery needs an SMTP server AND a sender. Set the server with Spring Boot's own variables — SPRING_MAIL_HOST,
# SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (from the environment, never this file) — and the
# sender below. Until both exist, emails wait in the email_outbox collection as PENDING and are sent once configured;
# a plan-change request is saved either way.
normaone.email.from=${NORMAONE_EMAIL_FROM:}
# Comma-separated recipients. Empty = every ACTIVE Super Admin's email address.
normaone.email.plan-change-recipients=${NORMAONE_EMAIL_PLAN_CHANGE_RECIPIENTS:}
# Link in the email, {requestId} replaced (e.g. https://admin.example.com/platform-plans/requests/{requestId}). Empty = no link.
normaone.email.plan-change-review-url=${NORMAONE_EMAIL_PLAN_CHANGE_REVIEW_URL:}
normaone.email.max-attempts=${NORMAONE_EMAIL_MAX_ATTEMPTS:5}
normaone.email.retry-interval=${NORMAONE_EMAIL_RETRY_INTERVAL:PT5M}

# Account status in Cognito: sign suspended/deactivated accounts out, disable deactivated ones, re-enable on
# reactivation. Needs cognito-idp:AdminUserGlobalSignOut, AdminDisableUser, AdminEnableUser and AdminGetUser.
# The application refuses non-ACTIVE accounts on every request regardless.
normaone.identity.sync-account-status=${NORMAONE_IDENTITY_SYNC_ACCOUNT_STATUS:true}
